name: Check Chaturbate Room
 
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:         # allow manual trigger from GitHub UI
 
jobs:
  check-room:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # Restore the state file from the previous run so we know if the
      # room was already online and avoid duplicate Discord notifications.
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state.txt
          key: chaturbate-state-${{ github.ref_name }}
          restore-keys: |
            chaturbate-state-
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install requests
 
      - name: Run room check
        run: python check_room.py
 
      # Save the updated state.txt so the next scheduled run can read it.
      - name: Save state cache
        uses: actions/cache@v4
        with:
          path: state.txt
          key: chaturbate-state-${{ github.ref_name }}
 
